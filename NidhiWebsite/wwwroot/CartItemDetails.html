<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Cart - Nidhi Jewellery</title>


    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">


    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


    <style>

        :root {
            --ink: #1B2521;
            --teal: #0B3D3A;
            --teal-deep: #072826;
            --gold: #C9A227;
            --gold-bright: #E0B93A;
            --cream: #F6F3EC;
            --sage: #EDF1E9;
            --sage-line: #C6CEC0;
            --success: #3E7A4F;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', Arial, sans-serif;
        }


        body {
            background: var(--cream);
            color: var(--ink);
        }


        /* =========================
           HEADER
        ========================= */

        header {
            background: var(--teal);
            color: var(--cream);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

            header h2 {
                font-family: 'Fraunces', serif;
                font-weight: 600;
                font-size: 21px;
            }

            header button {
                padding: 10px 20px;
                border: none;
                border-radius: 7px;
                cursor: pointer;
                background: transparent;
                color: var(--cream);
                font-weight: 600;
                font-size: 14px;
                border: 1.5px solid rgba(246,243,236,0.4);
                transition: border-color .18s ease, background .18s ease;
            }

                header button:hover {
                    border-color: var(--gold);
                    background: rgba(246,243,236,0.06);
                }

        /* =========================
           PAGE TITLE
        ========================= */

        
        /* Product Container (Cart Grid) */
        .product-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto 60px;
        }


        /* Product Card */

        .product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(7, 40, 38, 0.12);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid var(--sage-line);
        }


            .product-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 10px 24px rgba(7, 40, 38, 0.2);
            }


        /* Product Image */

        .product-image {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
            background: var(--sage);
        }


        /* Product Details */

        .product-details {
            padding: 18px 20px 20px;
        }


        .product-name {
            font-family: 'Fraunces', serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--teal-deep);
            margin-bottom: 8px;
        }


        .product-price {
            font-size: 19px;
            font-weight: bold;
            color: var(--success);
            margin-bottom: 16px;
        }


        /* =========================
           BUTTONS
        ========================= */

        .product-buttons {
            display: flex;
            gap: 10px;
        }


        .add-cart-btn,
        .buy-now-btn {
            flex: 1;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }


        .add-cart-btn {
            background: transparent;
            color: var(--teal);
            border: 2px solid var(--gold);
        }


            .add-cart-btn:hover {
                background: var(--gold);
                color: white;
            }


        .buy-now-btn {
            background: var(--teal);
            color: white;
            border: 2px solid var(--teal);
        }


            .buy-now-btn:hover {
                background: var(--teal-deep);
            }


        /* No Products */

        .no-products {
            text-align: center;
            padding: 80px 20px;
            font-size: 18px;
            color: #7C8880;
            grid-column: 1 / -1;
        }

            .no-products i {
                font-size: 44px;
                color: var(--sage-line);
                display: block;
                margin-bottom: 16px;
            }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 768px) {

            header {
                padding: 15px 20px;
            }

            .product-container {
                padding: 20px;
            }
        }
    </style>

</head>


<body>



    <header>
        <h2><i class="fa-solid fa-cart-shopping"></i>&nbsp; My Cart</h2>
        <button onclick="goBack()">Dashboard</button>
    </header>

    <div class="product-container" id="cartContainer"></div>

    <script>

        // ============================================
        // COOKIE HELPER
        // ============================================

        function getCookie(name) {

            const cookies = document.cookie.split(";");

            for (let cookie of cookies) {

                cookie = cookie.trim();

                if (cookie.startsWith(name + "=")) {

                    return decodeURIComponent(cookie.substring(name.length + 1));
                }

            }

            return null;

        }

        const userId = getCookie("userId");

        function goBack() {
            window.location.href = "dashboard";
        }

        // ============================================
        // LOAD CART ON PAGE LOAD
        // ============================================

        document.addEventListener("DOMContentLoaded", async function () {

            if (!userId) {
                alert("Please login to view your cart.");
                window.location.href = "UserLogin";
                return;
            }

            loadCartItems();

        });


        // ============================================
        // LOAD CART FROM API
        // ============================================

        async function loadCartItems() {

            const container = document.getElementById("cartContainer");

            try {

                const response = await fetch(`/api/Customer/GetAllCartItems?userId=${userId}`);

                if (!response.ok) {
                    throw new Error("Failed to load cart.");
                }

                const products = await response.json();

                container.innerHTML = "";

                if (!products || products.length === 0) {
                    container.innerHTML = `
                            <div class="no-products">
                                <i class="fa-solid fa-cart-shopping"></i>
                                Your cart is empty.
                            </div>
                        `;
                    return;
                }

                products.forEach(item => {

                    container.innerHTML += `
                            <div class="product-card">

                                <img class="product-image"
                                     src="${item.productImage}"
                                     alt="${item.productName}">

                                <div class="product-details">

                                    <div class="product-name">${item.productName}</div>

                                    <div class="product-price">
                                        &#8377; ${item.productPrice}
                                    </div>

                                    <div class="product-buttons">

                                        <button class="add-cart-btn"
                                                onclick="removeFromCart(${item.productID})">
                                            <i class="fa-solid fa-trash"></i>
                                            Remove
                                        </button>

                                        <button class="buy-now-btn"
                                                onclick="buyNow(${item.productID})">
                                            <i class="fa-solid fa-bolt"></i>
                                            Buy Now
                                        </button>

                                    </div>

                                </div>

                            </div>
                        `;
                });

            }
            catch (err) {
                console.error(err);
                container.innerHTML = "<div class='no-products'>Unable to load your cart.</div>";
            }
        }


        // ============================================
        // REMOVE FROM CART
        // ============================================

        async function removeFromCart(productId) {

            try {

                const response = await fetch(`/api/Customer/CartRemove?userid=${userId}&productid=${productId}`, {
                    method: "POST"
                });

                if (!response.ok) {
                    throw new Error("Failed to remove product.");
                }

                loadCartItems();

            }
            catch (err) {
                alert(err.message);
            }
        }


        // ============================================
        // BUY NOW
        // ============================================

        function buyNow(productId) {

            if (!userId) {
                alert("Please login to buy this product.");
                window.location.href = "UserLogin";
                return;
            }

            alert("Buy Now clicked for product " + productId + "!");
        }

    </script>
</body>
</html>
