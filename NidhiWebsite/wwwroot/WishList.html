<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Products</title>


    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        /* Product Container */
        .product-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            padding: 30px;
            max-width: 1200px;
            margin: 130px auto 0;
        }


        /* Product Card */

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            transition: transform 0.3s ease;
            cursor: pointer;
        }


            .product-card:hover {
                transform: translateY(-5px);
            }


        /* Product Image */

        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }


        /* Product Details */

        .product-details {
            padding: 20px;
        }


        .product-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }


        .product-code {
            font-size: 14px;
            color: #777;
            margin-bottom: 10px;
        }


        .product-price {
            font-size: 20px;
            font-weight: bold;
            color: #e67e22;
            margin-bottom: 10px;
        }


        .product-description {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }


        /* No Products */

        .no-products {
            text-align: center;
            padding: 50px;
            font-size: 20px;
            color: #777;
        }
    </style>

</head>


<body>

    <!-- Common Header will be loaded here -->
    <div id="headerContainer"></div>


    <!-- Product List -->
    <div class="product-container"
         id="productContainer">

    </div>


    <script src="Js/Headerjavascript.js"></script>

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                // Load common header first
                await loadHeader();

                // Load products
                loadProducts();

            }
        );


        function loadProducts() {

            const storedProducts =
                sessionStorage.getItem(
                    "itemGroupProducts"
                );


            const container =
                document.getElementById(
                    "productContainer"
                );


            if (!storedProducts) {

                container.innerHTML = `
                        <div class="no-products">
                            No products found.
                        </div>
                    `;

                return;

            }


            const products =
                JSON.parse(
                    storedProducts
                );


            if (
                !products ||
                products.length === 0
            ) {

                container.innerHTML = `
                        <div class="no-products">
                            No products found
                            for this item group.
                        </div>
                    `;

                return;

            }


            container.innerHTML = "";


            products.forEach(product => {

                const card =
                    document.createElement("div");


                card.className =
                    "product-card";


                card.innerHTML = `

                        <img
                            class="product-image"
                            src="${product.image}"
                            alt="${product.name}"
                            onerror="
                                this.src =
                                'images/no-image.png'
                            "
                        >

                        <div class="product-details">

                            <div class="product-name">
                                ${product.name}
                            </div>

                            <div class="product-code">
                                Product Code:
                                ${product.code}
                            </div>

                            <div class="product-price">
                                $${product.price}
                            </div>

                            <div class="product-description">
                                ${product.description || ""}
                            </div>

                        </div>

                    `;


                container.appendChild(card);

            });

        }

    </script>

</body>

</html>
