<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--<title>Nidhi Jewellery</title>-->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>


        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--teal);
            color: var(--cream);
            padding: 15px 40px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo img {
            width: 150px;
            height: 100px;
            align-content: center;
            border-radius: 10px;
        }

        .search-box {
            width: 40%;
            display: flex;
            align-items: center;
        }

            .search-box input {
                width: 100%;
                border: none;
                outline: none;
                background: transparent;
                border-bottom: 2px solid var(--gold);
                color: var(--cream);
                font-size: 18px;
                padding: 8px;
            }

                .search-box input::placeholder {
                    color: rgba(246,243,236,0.55);
                }

            .search-box span {
                margin-left: 10px;
                font-size: 22px;
                cursor: pointer;
                color: var(--gold-bright);
            }

        .menu {
            display: flex;
            align-items: center;
            gap: 35px;
        }

            .menu div {
                text-align: center;
                cursor: pointer;
            }

        .profile {
            position: relative;
        }

        #profileBtn {
            background: none;
            color: var(--cream);
            border: none;
            cursor: pointer;
            font-size: 18px;
        }

        .profile-popup {
            display: none;
            position: absolute;
            right: 0;
            top: 70px;
            width: 180px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(7,40,38,.25);
            overflow: hidden;
            border: 1px solid var(--sage-line);
        }

            .profile-popup button {
                width: 100%;
                border: none;
                background: white;
                padding: 12px;
                cursor: pointer;
                text-align: left;
                color: var(--ink);
                font-size: 14px;
            }

                .profile-popup button:hover {
                    background: var(--sage);
                    color: var(--teal-deep);
                }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

            button:hover {
                opacity: 0.9;
            }

        main {
            text-align: center;
            margin-top: 35px;
        }

        h1 {
            text-align: center;
            font-family: 'Fraunces', serif;
            font-weight: 600;
            color: var(--teal-deep);
        }


        /*Popup section*/

        /* ============================= */
        /* Login Popup */
        /* ============================= */

        .login-popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 40, 38, 0.75);
            backdrop-filter: blur(4px);
            z-index: 99999;
            align-items: center;
            justify-content: center;
        }

        .login-popup {
            position: relative;
            width: 90%;
            max-width: 420px;
            background: var(--cream);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(7, 40, 38, 0.4);
            animation: popupShow 0.3s ease;
        }

        /* Popup Animation */

        @keyframes popupShow {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Close Button */

        .login-popup-close {
            position: absolute;
            top: 12px;
            right: 15px;
            width: 35px;
            height: 35px;
            padding: 0;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--teal-deep);
            font-size: 28px;
            cursor: pointer;
            transition: 0.2s;
        }

            .login-popup-close:hover {
                background: var(--sage);
                color: var(--gold);
            }

        /* Icon */

        .login-popup-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--teal);
            color: var(--gold-bright);
            font-size: 30px;
            box-shadow: 0 5px 15px rgba(7, 40, 38, 0.25);
        }

        /* Heading */

        .login-popup h2 {
            font-family: 'Fraunces', serif;
            color: var(--teal-deep);
            font-size: 28px;
            margin-bottom: 12px;
        }

        /* Description */

        .login-popup p {
            color: #5F6B64;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Buttons Container */

        .login-popup-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Login Button */

        .popup-login-btn {
            width: 100%;
            background: transparent;
            color: var(--teal);
            border: 2px solid var(--gold);
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

            .popup-login-btn:hover {
                background: var(--gold);
                color: white;
            }

        /* Register Button */

        .popup-register-btn {
            width: 100%;
            background: transparent;
            color: var(--teal);
            border: 2px solid var(--gold);
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

            .popup-register-btn:hover {
                background: var(--gold);
                color: white;
            }
    </style>
</head>
<body>

    <div class="logo">
        <img src="/Upload/nidhilogo.png" alt="Logo">
    </div>

    <div class="search-box">
        <input type="text" placeholder="Search">
        <span>🔍</span>
    </div>

    <div class="menu">

        <div class="Home" onclick="GoToHome()">
            🏠
            <br>
            Home
        </div>

        <div class="profile">

            <button id="profileBtn">
                👤
                <br>
                Profile
            </button>

            <div class="profile-popup" id="profilePopup">

                <button id="loginBtn" onclick="goToLogin()">
                    Login
                </button>

                <button id="registerBtn" onclick="goToRegister()">
                    Register
                </button>

                <button id="Additem" onclick="goToAddItem()">
                    Add Item
                </button>

                <button id="Additemgroup" onclick="goToAddItemGroup()">
                    Add Item Group
                </button>

                <button id="AllItemGroup" onclick="goToAllItemGroup()">
                    Created Item Group
                </button>

                <button id="AllItem" onclick="goToAllItem()">
                    Created Item
                </button>
                <button id="ViewAllProducts" onclick="GoToViewAllProducts()">View All Products</button>
                <button id="logoutBtn" onclick="logout()">
                    Logout
                </button>

            </div>

        </div>


        <div class="profile" id="reportMenu" style="display:none;">

            <button id="reportBtn">
                📊
                <br>
                Report
            </button>

            <div class="profile-popup" id="reportPopup">

                <button onclick="goToMostWishlistReport()">
                    Most Wishlisted Products
                </button>

                <button onclick="goToMostCartReport()">
                    Most Cart Added Products
                </button>

            </div>

        </div>


        <div class="wishlist" onclick="LoginPopUp()">
            ❤️
            <br>
            Wishlist
        </div>


        <div class="cart" onclick="goToCart()">
            🛒
            <br>
            Cart
        </div>

    </div>


    <!-- Login Popup -->

    <div id="loginPopup" class="login-popup-overlay">

        <div class="login-popup">

            <button class="login-popup-close"
                    onclick="closeLoginPopUp()">
                &times;
            </button>

            <div class="login-popup-icon">
                🔐
            </div>

            <h2>Login Required</h2>

            <p>
                Please login to your account to access your
                Wishlist and Cart.
            </p>

            <div class="login-popup-buttons">

                <button class="popup-login-btn"
                        onclick="goToLogin()">
                    Login
                </button>

                <button class="popup-register-btn"
                        onclick="goToRegister()">
                    Create Account
                </button>

            </div>

        </div>

    </div>
</body>
</html>
