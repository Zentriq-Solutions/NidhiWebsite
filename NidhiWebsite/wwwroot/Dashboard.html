        <script>
            //#region Page Loading
            document.addEventListener("DOMContentLoaded", async function () {
                const pageLoader = document.getElementById("pageLoader");
                const pageContent = document.getElementById("pageContent");

                try {
                    await Promise.all([
                        loadItemGroups(),
                        loadProducts()
                    ]);
                } catch (error) {
                    console.error("Error loading page data:", error);
                } finally {
                    pageLoader.style.display = "none";
                    pageContent.style.display = "block";
                }
            });

            async function loadItemGroups() {
                try {
                    const response = await fetch("api/ItemGroup/GetAllItemGroupWiseFiltering");
                    if (!response.ok) {
                        throw new Error("Failed to load item groups");
                    }
                    const itemGroups = await response.json();
                    const container = document.querySelector(".itemgroupwisedata");
                    container.innerHTML = "";

                    itemGroups.forEach(itemGroup => {
                        const circle = document.createElement("div");
                        circle.className = "item-group-circle";
                        circle.dataset.itemGroupId = itemGroup.item_group_id;
                        const name = document.createElement("span");
                        name.textContent = itemGroup.item_group_name;
                        circle.appendChild(name);
                        circle.addEventListener("dblclick", function () {
                            getProductsByItemGroup(this.dataset.itemGroupId);
                        });
                        container.appendChild(circle);
                    });
                } catch (error) {
                    console.error("Error loading item groups:", error);
                    document.querySelector(".itemgroupwisedata").innerHTML = "<p>Unable to load item groups.</p>";
                }
            }

            function loadProducts() {
                return fetch("/api/Product/GetProduct")
                    .then(response => {
                        if (!response.ok) throw new Error("Failed to load products");
                        return response.json();
                    })
                    .then(products => {
                        const container = document.getElementById("productContainer");
                        container.innerHTML = "";

                        if (!products || products.length === 0) {
                            container.innerHTML = "<p>No products available.</p>";
                            return;
                        }

                        products.forEach(product => {
                            container.innerHTML += `
                    <div class="product-card">
                        <img src="${product.image}" alt="Product Image">
                        <div class="card-body">
                            <div class="product-name">${product.name}</div>
                            <div class="product-code">Code : ${product.code}</div>
                            <div class="product-price">₹ ${product.price}</div>
                            <div class="product-description">${product.description}</div>
                        </div>
                    </div>
                `;
                        });
                    })
                    .catch(error => {
                        console.log(error);
                        const container = document.getElementById("productContainer");
                        container.innerHTML = "<p>Unable to load products.</p>";
                    });
            }
            //#endregion Page Loading


            const profileBtn = document.getElementById("profileBtn");
            const popup = document.getElementById("profilePopup");

            profileBtn.onclick = function () {

                popup.style.display =
                    popup.style.display === "block"
                        ? "none"
                        : "block";
            };

            window.onclick = function (e) {

                if (!e.target.closest(".profile")) {

                    popup.style.display = "none";
                }

            };
            function goToAddItem() {
                window.location.href = "ProductCreation.html";
            }
            function goToAddItemGroup() {
                window.location.href = "ItemGroupCreation.html"
            }

            function goToAllItemGroup() {
                window.location.href = "AllItemGroup.html"
            }

            function logout() {

                deleteCookie("userId");
                deleteCookie("isAdmin");

                window.location.href = "dashboard.html";

            }
            function deleteCookie(name) {

                document.cookie = `${name}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/`;

            }

            function goToLogin() {
                window.location.href = "UserLogin.html";
            }

            function goToRegister() {
                window.location.href = "UserRegister.html";
            }


            function getCookie(name) {

                const cookies = document.cookie.split(";");

                for (let cookie of cookies) {

                    cookie = cookie.trim();

                    if (cookie.startsWith(name + "=")) {

                        return decodeURIComponent(cookie.substring(name.length + 1));

                    }

                }

                return null;

            }

            const userId = getCookie("userId");
            const isAdmin = getCookie("isAdmin");
            if (userId) {

                loginBtn.style.display = "none";
                registerBtn.style.display = "none";

                logoutBtn.style.display = "block";

                if (isAdmin == "true") {
                    Additem.style.display = "block";
                    AllItemGroup.style.display = "block";
                    Additemgroup.style.display = "block";

                }
                else {
                    Additem.style.display = "none";
                    AllItemGroup.style.display = "none";
                    Additemgroup.style.display = "none";
                }

            }
            else {

                loginBtn.style.display = "block";
                registerBtn.style.display = "block";

                logoutBtn.style.display = "none";
                Additem.style.display = "none";
                AllItemGroup.style.display = "none";
                Additemgroup.style.display = "none";
            }

            // Check Admin
            if (isAdmin === "true") {

                console.log("Admin");

            }
            else {

                console.log("Normal User");

            }


            /* ============================= */
            /* Carousel JavaScript */
            /* ============================= */

            let slideIndex = 0;

            const slides = document.querySelectorAll(".carousel-slide");
            const dots = document.querySelectorAll(".dot");

            function showSlide(index) {


                if (index >= slides.length) {
                    slideIndex = 0;
                }

                if (index < 0) {
                    slideIndex = slides.length - 1;
                }

                slides.forEach(slide => {
                    slide.classList.remove("active");
                });

                dots.forEach(dot => {
                    dot.classList.remove("active");
                });

                slides[slideIndex].classList.add("active");
                dots[slideIndex].classList.add("active");


            }

            function changeSlide(direction) {


                slideIndex = slideIndex + direction;

                showSlide(slideIndex);

            }

            function currentSlide(index) {


                slideIndex = index;

                showSlide(slideIndex);


            }

            /* Automatic Slide */

            setInterval(function () {


                slideIndex++;

                showSlide(slideIndex);


            }, 5000);
            //region Itemgroupwiseloading

                try {
                    const response = await fetch(`/api/Product/GetAllProductItemGroupWise?itemgroupid=${itemGroupId}`);
                    if (!response.ok) {

                    const products = await response.json();

                    sessionStorage.setItem("itemGroupProducts", JSON.stringify(products));

                    window.location.href = "ProductList.html";

                color: var(--teal-deep);
                padding: 10px;
                word-break: break-word;
            }

            .item-group-circle:hover {
                transform: translateY(-5px) scale(1.05);
                border-color: var(--gold);
                box-shadow: 0 8px 20px rgba(7, 40, 38, 0.22);
            }
    </style>
</head>
<body>
    <div id="pageLoader">
        <div class="loader-spinner"></div>
        <p>Loading, please wait...</p>
    </div>
    <div id="pageContent" style="display:none;">

        <header class="top-header">

            <div class="logo">
                <img src="/Upload/nidhilogo.png" alt="Logo">
            </div>

            <div class="search-box">
                <input type="text" placeholder="Search">
                <span>🔍</span>
            </div>

            <div class="menu">

                <div class="profile">

                    <button id="profileBtn">
                        👤
                        <br>
                        Profile
                    </button>

                    <div class="profile-popup" id="profilePopup">

                        <button id="loginBtn" onclick="goToLogin()">Login</button>

                        <button id="registerBtn" onclick="goToRegister()">Register</button>

                        <button id="Additem" onclick="goToAddItem()">Add Item</button>

                        <button id="Additemgroup" onclick="goToAddItemGroup()">Add Item Group</button>

                        <button id="AllItemGroup" onclick="goToAllItemGroup()">Created Item Group</button>

                        <button id="logoutBtn" onclick="logout()">Logout</button>

                    </div>

                </div>

                <div class="wishlist">
                    ❤️
                    <br>
                    Wishlist
                </div>

                <div class="cart">
                    🛒
                    <br>
                    Cart
                </div>

            </div>

        </header>

        <main>
            <section class="carousel-section">
                <div class="carousel-container">
                    <div class="carousel-slide active"> <img src="/Upload/33160b6e-882d-4024-b0cb-3b597a5e66ea.jpg" alt="Banner 1"> </div>
                    <div class="carousel-slide"> <img src="/Upload/8d1918ec-f121-4aa3-9e15-221b7b5ed821.jpg" alt="Banner 2"> </div>
                    <button class="carousel-btn prev" onclick="changeSlide(-1)"> ❮ </button>
                    <button class="carousel-btn next" onclick="changeSlide(1)"> ❯ </button>
                    <div class="carousel-dots"> <span class="dot active" onclick="currentSlide(0)"></span> <span class="dot" onclick="currentSlide(1)"></span> <span class="dot" onclick="currentSlide(2)"></span> </div>
                </div>
            </section>
            <section class="itemgroupwisedata">
            </section>
            <div id="productContainer"></div>
        </main>
    </div>
    <script>
        //#region Page Loading
        document.addEventListener("DOMContentLoaded", async function () {
            const pageLoader = document.getElementById("pageLoader");
            const pageContent = document.getElementById("pageContent");

            try {
                await Promise.all([
                    loadItemGroups(),
                    loadProducts()
                ]);
            } catch (error) {
                console.error("Error loading page data:", error);
            } finally {
                pageLoader.style.display = "none";
                pageContent.style.display = "block";
            }
        });

        async function loadItemGroups() {
            try {
                const response = await fetch("api/ItemGroup/GetAllItemGroupWiseFiltering");
                if (!response.ok) {
                    throw new Error("Failed to load item groups");
                }
                const itemGroups = await response.json();
                const container = document.querySelector(".itemgroupwisedata");
                container.innerHTML = "";

                itemGroups.forEach(itemGroup => {
                    const circle = document.createElement("div");
                    circle.className = "item-group-circle";
                    circle.dataset.itemGroupId = itemGroup.item_group_id;
                    const name = document.createElement("span");
                    name.textContent = itemGroup.item_group_name;
                    circle.appendChild(name);
                    circle.addEventListener("dblclick", function () {
                        getProductsByItemGroup(this.dataset.itemGroupId);
                    });
                    container.appendChild(circle);
                });
            } catch (error) {
                console.error("Error loading item groups:", error);
                document.querySelector(".itemgroupwisedata").innerHTML = "<p>Unable to load item groups.</p>";
            }
        }

        function loadProducts() {
            return fetch("/api/Product/GetProduct")
                .then(response => {
                    if (!response.ok) throw new Error("Failed to load products");
                    return response.json();
                })
                .then(products => {
                    const container = document.getElementById("productContainer");
                    container.innerHTML = "";

                    if (!products || products.length === 0) {
                        container.innerHTML = "<p>No products available.</p>";
                        return;
                    }

                    products.forEach(product => {
                        container.innerHTML += `
                        <div class="product-card">
                            <img src="${product.image}" alt="Product Image">
                            <div class="card-body">
                                <div class="product-name">${product.name}</div>
                                <div class="product-code">Code : ${product.code}</div>
                                <div class="product-price">₹ ${product.price}</div>
                                <div class="product-description">${product.description}</div>
                            </div>
                        </div>
                    `;
                    });
                })
                .catch(error => {
                    console.log(error);
                    const container = document.getElementById("productContainer");
                    container.innerHTML = "<p>Unable to load products.</p>";
                });
        }
        //#endregion Page Loading


        const profileBtn = document.getElementById("profileBtn");
        const popup = document.getElementById("profilePopup");

        profileBtn.onclick = function () {

            popup.style.display =
                popup.style.display === "block"
                    ? "none"
                    : "block";
        };

        window.onclick = function (e) {

            if (!e.target.closest(".profile")) {

                popup.style.display = "none";
            }

        };
        function goToAddItem() {
            window.location.href = "ProductCreation.html";
        }
        function goToAddItemGroup() {
            window.location.href = "ItemGroupCreation.html"
        }

        function goToAllItemGroup() {
            window.location.href = "AllItemGroup.html"
        }

        function logout() {

            deleteCookie("userId");
            deleteCookie("isAdmin");

            window.location.href = "dashboard.html";

        }
        function deleteCookie(name) {

            document.cookie = `${name}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/`;

        }

        function goToLogin() {
            window.location.href = "UserLogin.html";
        }

        function goToRegister() {
            window.location.href = "UserRegister.html";
        }


        function getCookie(name) {

            const cookies = document.cookie.split(";");

            for (let cookie of cookies) {

                cookie = cookie.trim();

                if (cookie.startsWith(name + "=")) {

                    return decodeURIComponent(cookie.substring(name.length + 1));

                }

            }

            return null;

        }

        const userId = getCookie("userId");
        const isAdmin = getCookie("isAdmin");
        if (userId) {

            loginBtn.style.display = "none";
            registerBtn.style.display = "none";

            logoutBtn.style.display = "block";

            if (isAdmin == "true") {
                Additem.style.display = "block";
                AllItemGroup.style.display = "block";
                Additemgroup.style.display = "block";

            }
            else {
                Additem.style.display = "none";
                AllItemGroup.style.display = "none";
                Additemgroup.style.display = "none";
            }

        }
        else {

            loginBtn.style.display = "block";
            registerBtn.style.display = "block";

            logoutBtn.style.display = "none";
            Additem.style.display = "none";
            AllItemGroup.style.display = "none";
            Additemgroup.style.display = "none";
        }

        // Check Admin
        if (isAdmin === "true") {

            console.log("Admin");

        }
        else {

            console.log("Normal User");

        }


        /* ============================= */
        /* Carousel JavaScript */
        /* ============================= */

        let slideIndex = 0;

        const slides = document.querySelectorAll(".carousel-slide");
        const dots = document.querySelectorAll(".dot");

        function showSlide(index) {


            if (index >= slides.length) {
                slideIndex = 0;
            }

            if (index < 0) {
                slideIndex = slides.length - 1;
            }

            slides.forEach(slide => {
                slide.classList.remove("active");
            });

            dots.forEach(dot => {
                dot.classList.remove("active");
            });

            slides[slideIndex].classList.add("active");
            dots[slideIndex].classList.add("active");


        }

        function changeSlide(direction) {


            slideIndex = slideIndex + direction;

            showSlide(slideIndex);

        }

        function currentSlide(index) {


            slideIndex = index;

            showSlide(slideIndex);


        }

        /* Automatic Slide */

        setInterval(function () {


            slideIndex++;

            showSlide(slideIndex);


        }, 5000);
        //region Itemgroupwiseloading
        // Call Product API
        async function getProductsByItemGroup(itemGroupId) {
            try {
                const response = await fetch(`/api/Product/GetAllProductItemGroupWise?itemgroupid=${itemGroupId}`);
                if (!response.ok) {
                    throw new Error("Failed to load products");
                }
                const products = await response.json();
                // Save products
                sessionStorage.setItem("itemGroupProducts", JSON.stringify(products));
                // Open Product List page
                window.location.href = "ProductList.html";
            } catch (error) {
                console.error("Error loading products:", error);
                alert("Unable to load products");
            }
        } // Load item groups when page loads



    </script>

</body>
</html>
