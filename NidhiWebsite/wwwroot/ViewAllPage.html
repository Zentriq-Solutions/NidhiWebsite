<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Products</title>
    <link rel="stylesheet" href="/Shared/layout.css">

    <style>

        :root {
            --ink: #1B2521;
            --teal: #0B3D3A;
            --teal-deep: #072826;
            --gold: #C9A227;
            --gold-bright: #E0B93A;
            --cream: #F6F3EC;
            --sage: #EDF1E9;
            --sage-line: #C6CEC0;
            --success: #3E7A4F;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', Arial, sans-serif;
        }

        body {
            background: var(--cream);
        }

        main {
            padding: 40px 30px;
        }

        /* Filter Bar */

        .filter-bar {
            max-width: 1200px;
            margin: 30px auto 0;
            padding: 18px 24px;
            background: white;
            border: 1px solid var(--sage-line);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            flex-wrap: wrap;
        }

        .filter-field {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
        }

            .filter-field label {
                font-size: 13px;
                font-weight: 600;
                color: var(--teal-deep);
            }

            .filter-field select {
                padding: 9px 12px;
                border: 1px solid var(--sage-line);
                border-radius: 8px;
                font-size: 14px;
                color: var(--ink);
                background: var(--sage);
                cursor: pointer;
            }

                .filter-field select:focus {
                    outline: none;
                    border-color: var(--teal);
                }

        .sort-options {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .sort-option {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            color: var(--ink);
            cursor: pointer;
        }

            .sort-option input {
                width: 16px;
                height: 16px;
                cursor: pointer;
            }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .apply-btn,
        .clear-btn {
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .apply-btn {
            background: var(--teal);
            color: white;
            border: 1px solid var(--teal);
        }

            .apply-btn:hover {
                background: var(--teal-deep);
            }

        .clear-btn {
            background: white;
            color: var(--teal-deep);
            border: 1px solid var(--sage-line);
        }

            .clear-btn:hover {
                background: var(--sage);
            }

        .product-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Product Card */

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            transition: transform 0.3s ease;
            cursor: pointer;
        }


            .product-card:hover {
                transform: translateY(-5px);
            }


        /* Product Image */

        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }


        /* Product Details */

        .product-details {
            padding: 20px;
        }


        .product-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }


        .product-code {
            font-size: 14px;
            color: #777;
            margin-bottom: 10px;
        }


        .product-price {
            font-size: 20px;
            font-weight: bold;
            color: #e67e22;
            margin-bottom: 10px;
        }


        .product-description {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }


        /* No Products */

        .no-products {
            text-align: center;
            padding: 50px;
            font-size: 20px;
            color: #777;
        }

        /* Pagination */

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 20px 0 50px;
            flex-wrap: wrap;
        }

        .page-btn {
            min-width: 38px;
            height: 38px;
            padding: 0 10px;
            border-radius: 8px;
            border: 1px solid var(--sage-line);
            background: white;
            color: var(--teal-deep);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

            .page-btn:hover:not(:disabled) {
                background: var(--sage);
            }

            .page-btn.active {
                background: var(--teal);
                color: white;
                border-color: var(--teal);
            }

            .page-btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }
    </style>

</head>


<body>

    <!-- Common Header will be loaded here -->
    <header class="top-header" id="layout"></header>

    <main>

        <!-- Sort Filter -->
        <div class="filter-bar">

            <div class="filter-field">
                <label>Sort by price</label>

                <div class="sort-options">

                    <label class="sort-option">
                        <input type="radio"
                               name="priceSort"
                               value="none"
                               checked>
                        <span>Default</span>
                    </label>

                    <label class="sort-option">
                        <input type="radio"
                               name="priceSort"
                               value="asc">
                        <span>Low to High</span>
                    </label>

                    <label class="sort-option">
                        <input type="radio"
                               name="priceSort"
                               value="desc">
                        <span>High to Low</span>
                    </label>

                </div>

                <div class="filter-buttons">

                    <button type="button"
                            id="applyFilter"
                            class="apply-btn">
                        Apply
                    </button>

                    <button type="button"
                            id="clearFilter"
                            class="clear-btn">
                        Clear
                    </button>

                </div>
            </div>

        </div>

        <!-- Product List -->
        <div class="product-container"
             id="productContainer">

        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>

    </main>


    <script src="/Shared/layout.js"></script>

    <script>

        const PAGE_SIZE = 15;
        let currentPage = 1;
        let currentSort = "none";
        let isLoading = false;
        let hasMorePages = true;

        // Load first page initially
        loadProducts(1);

        // Apply filter
        document.getElementById("applyFilter").addEventListener("click", function () {
            const selected = document.querySelector('input[name="priceSort"]:checked');
            if (!selected) return;
            currentSort = selected.value;
            currentPage = 1;
            hasMorePages = true;
            loadProducts(1, true);  // true = replace existing products
        });

        // Clear filter
        document.getElementById("clearFilter").addEventListener("click", function () {
            document.querySelector('input[name="priceSort"][value="none"]').checked = true;
            currentSort = "none";
            currentPage = 1;
            hasMorePages = true;
            loadProducts(1, true);
        });

        // Infinite scroll
        window.addEventListener("scroll", function () {
            if (isLoading || !hasMorePages) return;

            const scrollY = window.scrollY;
            const windowHeight = window.innerHeight;
            const documentHeight = document.documentElement.scrollHeight;

            // Load when user is within 200px of the bottom
            if (scrollY + windowHeight >= documentHeight - 200) {
                currentPage++;
                loadProducts(currentPage, false);
            }
        });

        async function loadProducts(page, replace = false) {
            isLoading = true;
            const container = document.getElementById("productContainer");
            const apiUrl = `/api/Product/GetViewAllProducts?pageNumber=${page}&pageSize=${PAGE_SIZE}&sort=${encodeURIComponent(currentSort)}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`API failed: ${response.status}`);

                const products = await response.json();

                if (replace) {
                    container.innerHTML = "";
                }

                if (!products || products.length === 0) {
                    hasMorePages = false;
                    if (replace) {
                        container.innerHTML = '<div class="no-products">No products found.</div>';
                    }
                    return;
                }

                // If returned fewer than PAGE_SIZE, no more pages
                if (products.length < PAGE_SIZE) {
                    hasMorePages = false;
                }

                products.forEach(product => {
                    const card = document.createElement("div");
                    card.className = "product-card";
                    card.innerHTML = `
                <img class="product-image" src="${product.image}" alt="${product.name}"
                     onerror="this.src='images/no-image.png'">
                <div class="product-details">
                    <div class="product-name">${product.name}</div>
                    <div class="product-code">Product Code: ${product.code}</div>
                    <div class="product-price">${product.price}</div>
                    <div class="product-description">${product.description || ""}</div>
                </div>
            `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error("API Error:", error);
                if (replace) {
                    container.innerHTML = '<div class="no-products">Unable to load products.</div>';
                }
            } finally {
                isLoading = false;
            }
        }

        fetch("/Shared/Layout.html")

            .then(response => {

                if (!response.ok) {
                    throw new Error(
                        "Unable to load Layout.html"
                    );
                }
                return response.text();

            })

            .then(data => {

                document.getElementById("layout")
                    .innerHTML = data;
                initializeLayout();

            })

            .catch(error => {

                console.error(error);

            });
    </script>

</body>

</html>
