<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #1B2521;
            --teal: #0B3D3A;
            --teal-deep: #072826;
            --gold: #C9A227;
            --gold-bright: #E0B93A;
            --cream: #F6F3EC;
            --sage-line: #C6CEC0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            background: var(--cream);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            padding: 24px;
        }

        .frame {
            width: 100%;
            max-width: 780px;
            display: grid;
            grid-template-columns: 0.9fr 1fr;
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 30px 60px -20px rgba(7, 40, 38, 0.35);
        }

        /* ---------- Left ledger panel ---------- */
        .panel {
            background: var(--teal);
            background-image: radial-gradient(circle at 85% 15%, rgba(201,162,39,0.18), transparent 55%), repeating-linear-gradient(0deg, rgba(255,255,255,0.045) 0px, rgba(255,255,255,0.045) 1px, transparent 1px, transparent 34px);
            color: var(--cream);
            padding: 44px 36px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .panel-top {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .mark {
            width: 46px;
            height: 46px;
            border: 1.5px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fraunces', serif;
            font-size: 20px;
            color: var(--gold-bright);
            flex-shrink: 0;
        }

        .brand {
            font-family: 'Fraunces', serif;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .brand-sub {
            font-size: 11.5px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(246,243,236,0.55);
            margin-top: 2px;
        }

        .panel-mid {
            margin-top: 46px;
        }

            .panel-mid h1 {
                font-family: 'Fraunces', serif;
                font-weight: 500;
                font-size: 28px;
                line-height: 1.3;
                margin: 0 0 14px;
            }

            .panel-mid p {
                font-size: 14px;
                line-height: 1.65;
                color: rgba(246,243,236,0.72);
                max-width: 28ch;
                margin: 0;
            }

        .panel-foot {
            font-size: 11.5px;
            color: rgba(246,243,236,0.4);
            letter-spacing: 0.04em;
        }

        /* ---------- Right form panel ---------- */
        .form-side {
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

            .form-side h2 {
                font-family: 'Fraunces', serif;
                font-weight: 600;
                font-size: 24px;
                margin: 0 0 4px;
                color: var(--teal-deep);
            }

            .form-side .lede {
                font-size: 13.5px;
                color: #6B7570;
                margin: 0 0 30px;
            }

        .field {
            margin-top: 20px;
        }

            .field:first-of-type {
                margin-top: 0;
            }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: #7C8880;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 9px 2px;
            border: none;
            border-bottom: 1.5px solid var(--sage-line);
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--ink);
            border-radius: 0;
            transition: border-color 0.18s ease;
        }

            input:focus {
                outline: none;
                border-bottom-color: var(--gold);
            }

            input::placeholder {
                color: #B8C0B9;
            }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 13px 18px;
            background: var(--teal);
            color: var(--cream);
            border: none;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            box-shadow: 0 8px 18px -8px rgba(11,61,58,0.55);
            transition: transform 0.12s ease, background 0.15s ease;
            font-family: 'Inter', sans-serif;
        }


            button:hover {
                background: var(--teal-deep);
                transform: translateY(-1px);
            }
            button:active {
                transform: translateY(3px);
                box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            }
        

        #message {
            margin-top: 16px;
            text-align: left;
            font-size: 13.5px;
            font-weight: 600;
            min-height: 18px;
            color: var(--error, #B3452C);
        }

        @media (max-width: 640px) {
            .frame {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 32px 28px;
            }

            .panel-mid h1 {
                font-size: 24px;
            }

            .form-side {
                padding: 34px 26px 38px;
            }
        }
    </style>
</head>
<body>

    <div class="frame">

        <div class="panel">
            <div>
                <div class="panel-top">
                    <div class="mark">N</div>
                    <div>
                        <div class="brand">Nidhi</div>
                        <div class="brand-sub">Member Registry</div>
                    </div>
                </div>

                <div class="panel-mid">
                    <h1>Welcome back to the ledger.</h1>
                    <p>Sign in to view your account and pick up right where you left off.</p>
                </div>
            </div>

            <div class="panel-foot">Kept confidential &middot; verified on submit</div>
        </div>

        <div class="form-side">

            <h2>Sign in</h2>
            <p class="lede">Enter your credentials to continue.</p>

            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="e.g. anjali.rao">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <button onclick="login()">Login</button>
            <button onclick="Register()">Register</button>
            <p id="message"></p>

        </div>

    </div>

    <script>
        //function setCookie(name, value) {
        //    document.cookie =`${name}=${encodeURIComponent(value)};path=/`;
        //}

        function setCookie(name, value, minutes = 30) {

            const date = new Date();
            date.setTime(date.getTime() + (minutes * 60 * 1000));

            document.cookie =
                `${name}=${encodeURIComponent(value)};expires=${date.toUTCString()};path=/;SameSite=Lax`;
        }

        //function setCookie(name, value, days = 3) {
        //    const date = new Date();
        //    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));

        //    document.cookie =
        //        `${name}=${encodeURIComponent(value)};expires=${date.toUTCString()};path=/;SameSite=Lax`;
        //}
        // Read Cookie
        function getCookie(name) {
            const cookies = document.cookie.split(";");
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith(name + "=")) {
                    return decodeURIComponent(cookie.substring(name.length + 1));
                }
            }
            return null;
        }
        // Delete Cookie (used during logout)
        function deleteCookie(name) {
            document.cookie = `${name}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/`;
        }
        async function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const response = await fetch("/api/NidhiWebsite/uservalidation", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    user_name: username,
                    user_password: password
                })
            });
            if (response.ok) {
                const data = await response.json();
                setCookie("userId", data.user_id);
                setCookie("isAdmin", data.user_is_admin);
                document.getElementById("message").innerHTML = "Login Successful";
                window.location.href = "dashboard";
            } else {
                document.getElementById("message").innerHTML = "Invalid Username or Password";
            }
        }
        async function Register() {
            window.location.href = "UserRegister";
        }
    </script>
</body>
</html>
