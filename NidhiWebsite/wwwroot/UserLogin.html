<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            width: 300px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-box">

        <h2>User Login</h2>

        <input type="text" id="username" placeholder="Username">

        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p id="message"></p>

    </div>

    <script>


        // Create Cookie
        function setCookie(name, value, hours = 1) {

            const date = new Date();

            date.setTime(date.getTime() + (hours * 60 * 60 * 1000));

            document.cookie =
                `${name}=${encodeURIComponent(value)};expires=${date.toUTCString()};path=/`;

        }

        // Read Cookie
        function getCookie(name) {

            const cookies = document.cookie.split(";");

            for (let cookie of cookies) {

                cookie = cookie.trim();

                if (cookie.startsWith(name + "=")) {

                    return decodeURIComponent(cookie.substring(name.length + 1));

                }

            }

            return null;

        }

        // Delete Cookie (used during logout)
        function deleteCookie(name) {

            document.cookie = `${name}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/`;

        }


async function login(){

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const response = await fetch("/api/NidhiWebsite/uservalidation", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            user_name:username,
            user_password:password
        })

    });

    if(response.ok){

        const data = await response.json();
        setCookie("userId", data.user_id);
        setCookie("isAdmin", data.user_is_admin);

        document.getElementById("message").innerHTML = "Login Successful";

        // Navigate to next page
        window.location.href="dashboard";

    }else{

        document.getElementById("message").innerHTML="Invalid Username or Password";

    }

}

    </script>

</body>
</html>
