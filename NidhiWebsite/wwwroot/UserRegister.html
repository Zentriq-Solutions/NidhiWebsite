<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 420px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #007BFF;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            resize: none;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

            button:hover {
                background: #0056b3;
            }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">

        <h2>Create User</h2>

        <form id="registerForm">

            <label>Username</label>
            <input type="text" id="username" required>

            <label>Password</label>
            <input type="password" id="userpassword" required>

            <label>Email</label>
            <input type="email" id="email" required>

            <label>Phone Number</label>
            <input type="text" id="phonenumber" required>

            <label>Place</label>
            <input type="text" id="place" required>

            <label>Pincode</label>
            <input type="text" id="pincode" pattern="[0-9]{6}" inputmode="numeric" required>

            <label>Address</label>
            <textarea id="address" rows="3" required></textarea>
            <div style="display:flex; gap:10px; margin-top:20px;">

                <button type="button" onclick="goBack()" style="background:#6c757d;">
                    Back
                </button>

                <button type="submit">
                    Register
                </button>

            </div>

        </form>

        <p id="message"></p>

    </div>

    <script>

        function goBack() {
            window.location.href = "Dashboard.html";
        }
document.getElementById("registerForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const userData = {

        user_name: document.getElementById("username").value,
        user_password: document.getElementById("userpassword").value,
        user_email: document.getElementById("email").value,
        user_phone_number: document.getElementById("phonenumber").value,
        user_place: document.getElementById("place").value,
        user_pincode: document.getElementById("pincode").value,
        user_address: document.getElementById("address").value,
        user_admin: false,
    };

    try{

        const response = await fetch("https://localhost:7280/api/NidhiWebsite/saveuser",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(userData)

        });

        if(response.ok){

            document.getElementById("message").innerHTML="User Registered Successfully.";
            document.getElementById("message").style.color="green";

            document.getElementById("registerForm").reset();

        }
        else{

            const error = await response.text();

            document.getElementById("message").innerHTML=error;
            document.getElementById("message").style.color="red";

        }

    }
    catch(err){

        document.getElementById("message").innerHTML="Unable to connect to server.";
        document.getElementById("message").style.color="red";

    }

});

    </script>

</body>
</html>
