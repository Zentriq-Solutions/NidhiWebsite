
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Item Groups</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Shared/layout.css">
    <style>
        :root {
            --ink: #1B2521;
            --teal: #0B3D3A;
            --teal-deep: #072826;
            --gold: #C9A227;
            --gold-bright: #E0B93A;
            --cream: #F6F3EC;
            --sage: #EDF1E9;
            --sage-line: #C6CEC0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', Arial, sans-serif;
        }

        body {
            background: var(--cream);
            color: var(--ink);
        }
        .container {
            width: 92%;
            max-width: 1100px;
            margin: 36px auto;
        }

            .container > h2 {
                margin-bottom: 18px;
                font-family: 'Fraunces', serif;
                font-weight: 600;
                color: var(--teal-deep);
                font-size: 22px;
            }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 20px 40px -20px rgba(7,40,38,.28);
        }

        th {
            background: var(--teal);
            color: var(--cream);
            padding: 14px 12px;
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            text-align: center;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--sage-line);
            text-align: center;
            font-size: 14.5px;
            transition: background .15s ease;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:nth-child(even) td {
            background: var(--sage);
        }

        tr:hover td {
            background: #FBF0D2;
        }

        .details-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: var(--teal);
            color: var(--cream);
            cursor: pointer;
            font-size: 16px;
            transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
            box-shadow: 0 6px 14px -6px rgba(7,40,38,.5);
        }

            .details-btn:hover {
                background: var(--gold);
                transform: scale(1.1);
                box-shadow: 0 8px 18px -6px rgba(201,162,39,.55);
            }
    </style>
</head>

<body>

    <header class="top-header" id="layout"></header>
    <div class="container">

        <table>
            <thead>
                <tr>
                    <th>Item Group Name</th>
                    <th>Item Group Code</th>
                    <th>Description</th>
                    <th>Details</th>
                    <th>Delete</th>

                </tr>
            </thead>

            <tbody id="itemGroupBody">
            </tbody>
        </table>

    </div>
    <script src="/Shared/layout.js"></script>
    <script>

        function goBack() {
            window.location.href = "dashboard";
        }

        window.onload = function () {
            loadItemGroups();
        }

        function loadItemGroups() {

            fetch("/api/ItemGroup/GetAllItemGroup")
                .then(response => response.json())
                .then(data => {

                    const tbody = document.getElementById("itemGroupBody");

                    tbody.innerHTML = "";

                    data.forEach(item => {

                        tbody.innerHTML += `
                            <tr>
                                <td>${item.item_group_name}</td>
                                <td>${item.item_group_code}</td>
                                <td>${item.item_group_description}</td>
                                <td>
                    <button class="details-btn"
                        onclick="viewDetails(${item.item_group_id})"
                        title="View Details">
                        👁️
                    </button>
                </td>
                <td>
                <button class="details-btn"
                onclick="Delete(${item.item_group_id})"
                title="View Details">
                🗑️
                </button>
                </td>
                            </tr>
                        `;

                    });

                })
                .catch(error => {
                    console.log(error);
                    alert("Unable to load Item Groups.");
                });

        }
        function viewDetails(id) {
            window.location.href = "ItemGroupCreation?id=" + id;
        }
        async function Delete(id) {

            const confirmDelete = confirm("Are you sure you want to delete this Item Group?");

            if (!confirmDelete) {
                return;
            }

            try {

                const response = await fetch(`/api/ItemGroup/DeleteItemGroup?itemgroupid=${id}`, {
                    method: "POST"
                });
                const message = await response.text();
                if (!response.ok) {
                    throw new Error(message);
                }

                alert(message);

                loadItemGroups();

            }
            catch (err) {
                alert(err.message);
            }
        }
        fetch("/Shared/Layout.html")

            .then(response => {

                if (!response.ok) {
                    throw new Error(
                        "Unable to load Layout.html"
                    );
                }
                return response.text();

            })

            .then(data => {

                document.getElementById("layout")
                    .innerHTML = data;
                initializeLayout();

            })

            .catch(error => {

                console.error(error);

            });
    </script>

</body>
</html>
