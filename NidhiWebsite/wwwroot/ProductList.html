<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Products</title>
    <link rel="stylesheet" href="/Shared/layout.css">

    <style>

        :root {
            --ink: #1B2521;
            --teal: #0B3D3A;
            --teal-deep: #072826;
            --gold: #C9A227;
            --gold-bright: #E0B93A;
            --cream: #F6F3EC;
            --sage: #EDF1E9;
            --sage-line: #C6CEC0;
            --success: #3E7A4F;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', Arial, sans-serif;
        }

        body {
            background: var(--cream);
        }

        main {
            padding: 40px 30px;
        }
        .product-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            padding: 30px;
            max-width: 1200px;
            margin: 20px auto 0;
        }

        /* Product Card */

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            transition: transform 0.3s ease;
            cursor: pointer;
        }


            .product-card:hover {
                transform: translateY(-5px);
            }


        /* Product Image */

        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }


        /* Product Details */

        .product-details {
            padding: 20px;
        }


        .product-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }


        .product-code {
            font-size: 14px;
            color: #777;
            margin-bottom: 10px;
        }


        .product-price {
            font-size: 20px;
            font-weight: bold;
            color: #e67e22;
            margin-bottom: 10px;
        }


        .product-description {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }


        /* No Products */

        .no-products {
            text-align: center;
            padding: 50px;
            font-size: 20px;
            color: #777;
        }
    </style>

</head>


<body>

    <!-- Common Header will be loaded here -->
    <header class="top-header" id="layout"></header>


    <!-- Product List -->
    <div class="product-container"
         id="productContainer">

    </div>


    <script src="/Shared/layout.js"></script>

    <script>

        document.addEventListener("DOMContentLoaded", function () {


            loadProducts();

            loadHeader();
        });


        async function loadProducts() {


            const container =
                document.getElementById("productContainer");

            const urlParams =
                new URLSearchParams(window.location.search);

            const itemgroupid =
                urlParams.get("itemgroupid");

            if (!itemgroupid) {

                container.innerHTML = `
            <div class="no-products">
                No item group specified.
            </div>
        `;

                return;
            }

            const apiUrl =
                `/api/Product/GetAllProductItemGroupWise?itemgroupid=${itemgroupid}`;

            try {

                const response = await fetch(apiUrl);


                if (!response.ok) {
                    throw new Error(
                        `API failed: ${response.status}`
                    );
                }

                const products = await response.json();

                if (
                    !products ||
                    products.length === 0
                ) {

                    container.innerHTML = `
        <div class="no-products">
            No products found
            for this item group.
        </div>
    `;

                    return;

                }

                container.innerHTML = "";

                products.forEach(product => {

                    const card =
                        document.createElement("div");

                    card.className =
                        "product-card";

                    card.innerHTML = `

        <img
            class="product-image"
            src="${product.image}"
            alt="${product.name}"
            onerror="
                this.src =
                'images/no-image.png'
            "
        >

        <div class="product-details">

            <div class="product-name">
                ${product.name}
            </div>

            <div class="product-code">
                Product Code:
                ${product.code}
            </div>

            <div class="product-price">
                $${product.price}
            </div>

            <div class="product-description">
                ${product.description || ""}
            </div>

        </div>

    `;

                    container.appendChild(card);

                });

            }
            catch (error) {

                console.error("API Error:", error);

                container.innerHTML = `
            <div class="no-products">
                Unable to load products.
            </div>
        `;
            }
        }
        fetch("/Shared/Layout.html")

            .then(response => {

                if (!response.ok) {
                    throw new Error(
                        "Unable to load Layout.html"
                    );
                }
                return response.text();

            })

            .then(data => {

                document.getElementById("layout")
                    .innerHTML = data;
                initializeLayout();

            })

            .catch(error => {

                console.error(error);

            });
    </script>

</body>

</html>
